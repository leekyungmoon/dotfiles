# tmux working-environment auto save and restore
# (tmux-resurrect + tmux-continuum; see docs/tmux-auto-restore.ko.md)
#
# Source this file from tmux.conf BEFORE the line that runs TPM: TPM finds the
# @plugin lines below textually (it reads files sourced from tmux.conf), and
# tmux-continuum reads @continuum-* when TPM loads it.  Nothing here depends on
# running after TPM.
#
# Paths: ~/.dotfiles is the checkout itself, as in upstream wookayin/dotfiles.
# Plugin option values never contain "$": tmux 3.4 (Ubuntu 24.04) prints "$"
# as "\$" in `show-option -v`, which is how the plugins read them, so paths
# are made absolute here by run-shell (whose /bin/sh expands $HOME).

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Snapshot directory: ${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect.
# resurrect only expands ~/$HOME itself, so compute the absolute path here.
# It holds terminal scrollback; resurrect-save keeps it 0700 / files 0600.
run-shell 'd="${XDG_DATA_HOME:-}"; case "$d" in /*) ;; *) d="$HOME/.local/share" ;; esac; tmux set-option -g @resurrect-dir "$d/tmux/resurrect"'
set -g @resurrect-never-overwrite 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'

# Only these are re-run on restore (plus resurrect's default vi/less/... list).
# The post-save hook rewrites every Codex/Claude pane to a proven resume
# command ("codex resume <id>", "<absolute claude path> ... --resume <id>") or
# to nothing, so these patterns match only hook-written commands.  resurrect
# matches each element as the regex ^<element>( |$); the claude element accepts
# whatever absolute launcher path the hook resolved on this machine.
set -g @resurrect-processes '"codex resume" "/[^[:space:]]*/claude"'
run-shell 'tmux set-option -g @resurrect-hook-post-save-layout "\"$HOME/.dotfiles/tmux/resurrect-ai-session.py\""'

# Remove the temporary login session only when a restore brought back others
# (some session other than __continuum_startup exists).
set -g @resurrect-hook-post-restore-all 'tmux list-sessions -F "#{session_name}" | grep -qvx __continuum_startup && tmux kill-session -t =__continuum_startup 2>/dev/null || true'

# Restore automatically when the tmux server starts (e.g. from tmux.service).
set -g @continuum-restore 'on'

# Saving: every save goes through resurrect-save (lock + hook verification).
# resurrect.tmux resets @resurrect-save-script-path to its raw save.sh when TPM
# loads it, so continuum's own timer would bypass that wrapper; it is turned
# off and tmux-resurrect-autosave.timer saves every minute instead, attached
# or not.  prefix + C-s saves manually through the same wrapper.
set -g @continuum-save-interval '0'
# A blank (not empty) value makes resurrect.tmux bind no save key, so the
# binding below survives plugin loading.  prefix + C-r stays upstream restore.
set -g @resurrect-save ' '
bind-key C-s run-shell '"$HOME/.dotfiles/tmux/resurrect-save" && tmux display-message "tmux environment saved"'

# tmux.service is a static unit managed by the installer.  continuum's boot
# handling writes its own unit when ~/.config/systemd/user/tmux.service is
# missing and runs `systemctl --user enable` (boot on) or `disable` (boot off)
# on every plugin load.  Choose the value that makes that a no-op: "on" only
# when the managed unit exists and is already enabled, "off" otherwise (disable
# of a unit that is not enabled changes nothing).  A unit the user disabled
# therefore stays disabled.
if-shell 'c="${XDG_CONFIG_HOME:-}"; case "$c" in /*) ;; *) c="$HOME/.config" ;; esac; test -f "$c/systemd/user/tmux.service" && systemctl --user is-enabled tmux.service >/dev/null 2>&1' "set -g @continuum-boot 'on'" "set -g @continuum-boot 'off'"
set -g @continuum-systemd-start-cmd 'new-session -d -s __continuum_startup'

# New panes (including restored ones) start an interactive login zsh; fall
# back to the login shell when zsh is not installed yet.
set -g default-command 'if command -v zsh >/dev/null 2>&1; then exec zsh -il; else exec "${SHELL:-/bin/sh}" -l; fi'
